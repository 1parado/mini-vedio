name: Release

# 推送 v* 标签 → 构建 exe → 体积断言 → 发布 GitHub Release；
# 也可在 Actions 页手动触发（仅构建+产物，不发 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Build exe
        env:
          CGO_ENABLED: '0' # 硬约束：纯 Go，无 CGO
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o bin/mini-vedio.exe .

      - name: Patch resources (icon/version/manifest)
        shell: pwsh
        run: '& "$(go env GOPATH)\bin\go-winres.exe" patch --no-backup bin/mini-vedio.exe' # 须在仓库根目录执行

      - name: Size assertion (<= 13 MB)
        shell: pwsh
        run: |
          $sizeMB = [math]::Round((Get-Item bin/mini-vedio.exe).Length / 1MB, 2)
          Write-Host ("体积: {0} MB (上限 13 MB)" -f $sizeMB)
          if ($sizeMB -gt 13) { throw ("体积断言失败: {0} MB > 13 MB，请检查新增依赖" -f $sizeMB) }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-vedio-windows-x64
          path: bin/mini-vedio.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/mini-vedio.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
